<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Glow & Border Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2185f8" />
      <stop offset="100%" stop-color="#0a50b8" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="100%" stop-color="#d60017" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2bb3ff" />
      <stop offset="100%" stop-color="#0066d6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#002255" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Cyan Rim -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.85" />
  
  <!-- Outer Blue Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#ringGrad)" />

  <!-- White Medical Ring Text / Marks (Stylized) -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-dasharray="2 3" />
  <circle cx="50" cy="50" r="33" fill="#ffffff" filter="url(#subtleGlow)" />

  <!-- Inner Medical Red Cross -->
  <g filter="url(#subtleGlow)">
    <path d="M 45 22 L 55 22 L 55 35 L 68 35 L 68 45 L 55 45 L 55 58 L 45 58 L 45 45 L 32 45 L 32 35 L 45 35 Z" fill="url(#crossGrad)" rx="1.5" />
  </g>

  <!-- Blue Laurel Leaves / Dove Wings Cradling Bottom -->
  <g fill="url(#wingGrad)">
    <!-- Left Wing -->
    <path d="M 50 63 C 44 63 32 58 26 49 C 27 57 34 68 44 71 C 47 72 49 71 50 70 Z" opacity="0.95" />
    <!-- Right Wing -->
    <path d="M 50 63 C 56 63 68 58 74 49 C 73 57 66 68 56 71 C 53 72 51 71 50 70 Z" opacity="0.95" />
    <!-- Center Olive Sprout -->
    <path d="M 47 67 C 49 64 51 64 53 67 C 52 70 48 70 47 67 Z" fill="#2bb3ff" />
  </g>

  <!-- Inner Cyan Ring Accent -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#2185f8" stroke-width="1.2" opacity="0.6" />
</svg>
