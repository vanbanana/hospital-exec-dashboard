services:
  backend:
    environment:
      AUTH_COOKIE_SECURE: "1"
  web:
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ./nginx-production.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TLS_CERT_FILE:?Set TLS_CERT_FILE in .env}
        target: /etc/nginx/certs/edss.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TLS_KEY_FILE:?Set TLS_KEY_FILE in .env}
        target: /etc/nginx/certs/edss.key
        read_only: true
        bind: {create_host_path: false}
