# EDSS prod 反代——单端口入口(architecture §6):静态 SPA + /api 反代 backend
# /ready /stats 为内部运维面,刻意不透出

# P1 登录限流:10r/s burst=5 超出即拒——叠加账号侧 20104 锁(15min/5次)形成 IP×账号双闸;
# $binary_remote_addr 按客户端 IP 计数(经 XFF 可信链由 backend 另行校正,此处以直连源为准)
limit_req_zone $binary_remote_addr zone=edss_login:10m rate=10r/s;

upstream edss_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # P1 安全响应头(SPA 面唯一生效位——后端 JSON 同源头见 router 中间件)。
    # CSP 收敛面:ECharts canvas + Vue scoped + 无 inline script;
    # style-src 'unsafe-inline' 留位给 index.html 内联 <style> 与运行时 style 属性。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # vite 产物带内容 hash,长缓存安全
    location /assets/ {
        expires 30d;
        # nginx add_header 不向下继承:本 location 已有 add_header → server 级安全头须重申
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header Cache-Control "immutable";
    }

    # P1 登录限流——exact match 先于前缀 /api/;超限 nginx 直回 503(不进包络)
    location = /api/v1/auth/login {
        limit_req zone=edss_login burst=5 nodelay;
        proxy_pass http://edss_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 契约面:原样透传 URI(/api/v1/* → 后端 /api/v1/*)
    location /api/ {
        proxy_pass http://edss_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # LB 存活探针透出(backend /health 无依赖、恒 200)
    location = /health {
        proxy_pass http://edss_backend/health;
    }

    # vue-router createWebHistory:前端路由全部回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# TLS 终结(本地演示自签):证书固定路径 /etc/nginx/certs/edss.{crt,key}——
# 由 deploy/certs 卷挂载供给(gen-selfsigned.sh 生成);镜像内兜底自签保证裸基座也能起。
# http :80 server 保留不跳转——compose 内网与 LB 回源场景仍走 http。
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/edss.crt;
    ssl_certificate_key /etc/nginx/certs/edss.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # P1 安全响应头(与 :80 server 同口径)+ HSTS——HTTPS 面专属
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /assets/ {
        expires 30d;
        # add_header 不向下继承:本 location 自带头 → 安全头+HSTS 重申
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "immutable";
    }

    # P1 登录限流——与 :80 同 zone(跨协议共享计数)
    location = /api/v1/auth/login {
        limit_req zone=edss_login burst=5 nodelay;
        proxy_pass http://edss_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://edss_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://edss_backend/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
