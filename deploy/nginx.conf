# EDSS prod 反代——单端口入口(architecture §6):静态 SPA + /api 反代 backend
# /ready /stats 为内部运维面,刻意不透出

upstream edss_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # vite 产物带内容 hash,长缓存安全
    location /assets/ {
        expires 30d;
        add_header Cache-Control "immutable";
    }

    # 契约面:原样透传 URI(/api/v1/* → 后端 /api/v1/*)
    location /api/ {
        proxy_pass http://edss_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # LB 存活探针透出(backend /health 无依赖、恒 200)
    location = /health {
        proxy_pass http://edss_backend/health;
    }

    # vue-router createWebHistory:前端路由全部回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
