services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be nonempty}
    restart: unless-stopped
  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be nonempty}@db:5432/hospital_edss?sslmode=disable}
      SEED_ON_BOOT: "0"
      SIM_ENABLED: "0"
      DEMO_ROLE_SWITCH: "0"
      AUTH_COOKIE_SECURE: "1"
      SCREEN_PUBLIC: "0"
    restart: unless-stopped
  web:
    ports: !override
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./nginx-production.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERT_FILE:-./certs/edss.crt}
        target: /etc/nginx/certs/edss.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_FILE:-./certs/edss.key}
        target: /etc/nginx/certs/edss.key
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
